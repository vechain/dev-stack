services:
  vechain-postgres:
    image: ${VECHAIN_DEV_POSTGRES_IMAGE:-postgres:16}
    container_name: vechain-postgres
    hostname: vechain-postgres
    command: ["postgres", "-c", "synchronous_commit=off"]
    ports:
      - "${VECHAIN_DEV_POSTGRES_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_DB: vechain
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d vechain"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - vechain-thor

  vechain-indexer:
    image: ${VECHAIN_DEV_INDEXER_IMAGE:-vechain/indexer:10.6}
    container_name: vechain-indexer
    depends_on:
      vechain-postgres:
        condition: service_healthy
    volumes:
      - ${VECHAIN_DEV_GENESIS:?VECHAIN_DEV_GENESIS not set}:/usr/app/genesis-solo.json:ro
    env_file:
      - ${VECHAIN_DEV_HOME:?VECHAIN_DEV_HOME not set}/generated/indexer.env
    environment:
      PG_URL: "jdbc:postgresql://vechain-postgres:5432/vechain"
      PG_USER: indexer
      PG_PASSWORD: password
      PG_API_PASSWORD: password
      THOR_URL: "http://thor-solo:8669"
      INDEXER_GENESIS_VET_BALANCES_RESOURCE: "file:/usr/app/genesis-solo.json"
      INDEXER_CATCH_UP_INTERVAL_SECONDS: "15"
    # Liveness answers once Spring's context is up, by which point Flyway has
    # migrated and the read-only `api` role the indexer-api logs in as exists.
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/actuator/health/liveness || exit 1
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    networks:
      - vechain-thor

  vechain-indexer-api:
    image: ${VECHAIN_DEV_INDEXER_API_IMAGE:-vechain/indexer-api:10.6}
    container_name: vechain-indexer-api
    depends_on:
      vechain-indexer:
        condition: service_healthy
    env_file:
      - ${VECHAIN_DEV_HOME:?VECHAIN_DEV_HOME not set}/generated/indexer-api.env
    environment:
      PG_URL: "jdbc:postgresql://vechain-postgres:5432/vechain"
      PG_USER: api
      PG_PASSWORD: password
      THOR_URL: "http://thor-solo:8669"
    ports:
      - "8089:8080"
    networks:
      - vechain-thor

networks:
  vechain-thor:
    external: true
